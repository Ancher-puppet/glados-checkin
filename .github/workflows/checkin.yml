name: GLaDOS Daily Check-in

on:
  workflow_dispatch:
    inputs:
      verify_browser:
        description: "即使今日已签到，也测试一次官方网页签到流程"
        type: boolean
        default: false
      native_safari:
        description: "在 GitHub macOS 云端运行原生 Safari 测试"
        type: boolean
        default: false
      native_chrome:
        description: "在 GitHub 云端使用原生 Chrome 完成官网验证"
        type: boolean
        default: true
  schedule:
    # UTC 01:07，即北京时间每天 09:07；GitHub 调度可能延迟。
    - cron: "7 1 * * *"
    # 下午和晚间补漏；已确认今日流水时直接退出，不重复签到。
    - cron: "17 7 * * *"
    - cron: "27 13 * * *"
    # 月度仓库活动，避免公开仓库长期无提交导致定时工作流停用。
    - cron: "37 0 1 * *"

permissions:
  contents: read

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  checkin:
    if: github.event_name != 'schedule' || github.event.schedule != '37 0 1 * *'
    runs-on: ${{ inputs.native_safari && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Check result handling
        run: python -m unittest discover -s tests -v
      - name: Install browser
        if: ${{ !inputs.native_safari }}
        env:
          NATIVE_CHROME: ${{ (github.event_name == 'schedule' || inputs.native_chrome) && '1' || '0' }}
        run: |
          python -m pip install -r requirements.txt
          if [ "$NATIVE_CHROME" != "1" ]; then
            python -m playwright install --with-deps chromium webkit firefox
          fi
          google-chrome --version
      - name: Install official Safari automation support
        if: ${{ inputs.native_safari }}
        run: |
          python -m pip install selenium==4.47.0
          sudo /usr/bin/safaridriver --enable
      - name: Check in through the official page
        if: ${{ !inputs.native_safari }}
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_USER_AGENT: ${{ secrets.GLADOS_USER_AGENT }}
          GLADOS_VERIFY_BROWSER: ${{ inputs.verify_browser && '1' || '0' }}
          GLADOS_NATIVE_CHROME: ${{ (github.event_name == 'schedule' || inputs.native_chrome) && '1' || '0' }}
        run: xvfb-run -a python checkin.py
      - name: Check in through native Safari
        if: ${{ inputs.native_safari }}
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_USER_AGENT: ${{ secrets.GLADOS_USER_AGENT }}
          GLADOS_VERIFY_BROWSER: ${{ inputs.verify_browser && '1' || '0' }}
        run: python safari_checkin.py

  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '37 0 1 * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Maintain scheduled workflow activity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'Keep daily check-in schedule active'
          git push origin HEAD:main
