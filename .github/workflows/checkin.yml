name: GLaDOS Daily Check-in

on:
  workflow_dispatch:
    inputs:
      verify_browser:
        description: "即使今日已签到，也测试一次官方网页签到流程"
        type: boolean
        default: false
  schedule:
    # UTC 01:07，即北京时间每天 09:07；GitHub 调度可能延迟。
    - cron: "7 1 * * *"

permissions:
  contents: read

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Check result handling
        run: python -m unittest discover -s tests -v
      - name: Install browser
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium webkit firefox
      - name: Check in through the official page
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_USER_AGENT: ${{ secrets.GLADOS_USER_AGENT }}
          GLADOS_VERIFY_BROWSER: ${{ inputs.verify_browser && '1' || '0' }}
        run: xvfb-run -a python checkin.py
